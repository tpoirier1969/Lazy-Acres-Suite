<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Timer</title>
  <desc id="desc">A detailed brass stopwatch.</desc>
  <defs>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fbfbf7"/>
      <rect width="12" height="12" fill="#ecece8" opacity="0.72"/>
      <rect x="12" y="12" width="12" height="12" fill="#ecece8" opacity="0.72"/>
    </pattern>
    <radialGradient id="face" cx="46%" cy="38%" r="66%">
      <stop offset="0" stop-color="#fff7dc"/>
      <stop offset="0.58" stop-color="#e8d9ad"/>
      <stop offset="1" stop-color="#c9b06d"/>
    </radialGradient>
    <linearGradient id="brass" x1="114" y1="92" x2="388" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8df8c"/>
      <stop offset="0.25" stop-color="#c89439"/>
      <stop offset="0.52" stop-color="#8b6226"/>
      <stop offset="0.76" stop-color="#c18a35"/>
      <stop offset="1" stop-color="#62441e"/>
    </linearGradient>
    <linearGradient id="brassLight" x1="150" y1="112" x2="330" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0ae"/>
      <stop offset="1" stop-color="#b47c2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2c2111" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="76" fill="url(#checker)"/>
  <g filter="url(#shadow)">
    <circle cx="256" cy="282" r="148" fill="url(#brass)" stroke="#62441e" stroke-width="10"/>
    <circle cx="256" cy="282" r="124" fill="url(#face)" stroke="#5b4320" stroke-width="8"/>
    <circle cx="256" cy="282" r="107" fill="none" stroke="#8d743d" stroke-width="3" opacity="0.75"/>
    <circle cx="256" cy="282" r="12" fill="#39433e" stroke="#5b4320" stroke-width="5"/>
    <path d="M256 282l66-72" stroke="#39433e" stroke-width="9" stroke-linecap="round"/>
    <path d="M256 282l-34 38" stroke="#39433e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="256" cy="202" r="33" fill="url(#face)" stroke="#6b4a21" stroke-width="6"/>
    <circle cx="256" cy="202" r="22" fill="none" stroke="#856332" stroke-width="3" opacity="0.75"/>
    <path d="M256 189v12m0 0l9 8" stroke="#39433e" stroke-width="5" stroke-linecap="round"/>
    <path d="M160 282h-17m226 0h-17m-96-96v-17m0 226v-17" stroke="#5b4320" stroke-width="6" stroke-linecap="round"/>
    <path d="M179 215l-13-13m167 167l-12-12m0-142l12-13m-167 167l13-12" stroke="#5b4320" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
    <g font-family="Georgia,serif" font-size="31" fill="#3f321a" text-anchor="middle" font-weight="700">
      <text x="256" y="176">60</text>
      <text x="331" y="214">10</text>
      <text x="360" y="293">15</text>
      <text x="318" y="366">25</text>
      <text x="256" y="394">30</text>
      <text x="193" y="366">35</text>
      <text x="153" y="293">45</text>
      <text x="181" y="214">50</text>
    </g>
    <path d="M215 107c0-36 82-36 82 0" fill="none" stroke="url(#brass)" stroke-width="17" stroke-linecap="round"/>
    <rect x="226" y="111" width="60" height="52" rx="13" fill="url(#brassLight)" stroke="#62441e" stroke-width="8"/>
    <path d="M237 120v31m12-31v31m12-31v31m12-31v31" stroke="#6d4a1f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <rect x="326" y="139" width="46" height="34" rx="8" transform="rotate(29 349 156)" fill="url(#brassLight)" stroke="#62441e" stroke-width="7"/>
    <path d="M160 385c43 39 149 40 192 0" fill="none" stroke="#ffe9a6" stroke-width="8" stroke-linecap="round" opacity="0.52"/>
    <path d="M168 194c38-53 135-70 188-7" fill="none" stroke="#fff0ad" stroke-width="8" stroke-linecap="round" opacity="0.48"/>
  </g>
</svg>
