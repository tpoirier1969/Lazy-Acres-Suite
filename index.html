<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazy Acres Suite</title>
  <meta name="theme-color" content="#315f48">
  <link rel="icon" href="./assets/app-shell/mountain-photo-icon.png?v=0.1.21" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=0.1.21">
  <link rel="manifest" href="./site.webmanifest?v=0.1.21">
  <link rel="stylesheet" href="./styles.css?v=0.1.40">
  <link rel="stylesheet" href="./assets/app-shell/generated-art.css?v=0.1.18">
  <link rel="stylesheet" href="./assets/app-shell/dashboard-polish.css?v=0.1.18">
  <link rel="stylesheet" href="./assets/app-shell/arrange-mode-fix.css?v=0.1.19">
  <link rel="stylesheet" href="./assets/app-shell/landing-compact.css?v=0.1.20">
  <link rel="stylesheet" href="./assets/app-shell/today-desktop-pass.css?v=0.1.51">
</head>
<body>
  <noscript><main class="no-script"><h1>Lazy Acres Suite</h1><p>This app shell needs JavaScript enabled.</p></main></noscript>
  <div id="app" data-app-shell-root></div>
  <script type="module" src="./assets/app-shell/app.js?v=0.1.56"></script>
  <script type="module" src="./assets/app-shell/photo-icon.js?v=0.1.21"></script>
  <script type="module" src="./assets/app-shell/today-desktop-pass.js?v=0.1.55"></script>
  <script type="module" src="./assets/app-shell/timer-card-projects.js?v=0.1.52"></script>
  <script type="module" src="./assets/app-shell/timer-card-controls.js?v=0.1.53"></script>
  <script type="module">
    const exactModuleIcons = {
      'boat-estimator': './assets/app-shell/icons/field-lab/boat-estimator.svg?v=0.1.56',
      timer: './assets/app-shell/icons/field-lab/timer.svg?v=0.1.56',
    };

    function applyExactModuleIcons() {
      document.querySelectorAll('[data-module-card]').forEach((card) => {
        const slug = card.dataset.moduleSlug;
        const src = exactModuleIcons[slug];
        if (!src) return;
        const icon = card.querySelector('.module-icon');
        if (!icon) return;
        const current = icon.querySelector('img')?.getAttribute('src') || '';
        if (current === src) return;
        icon.classList.remove('module-icon-missing');
        icon.innerHTML = `<img src="${src}" alt="" loading="eager" decoding="async">`;
      });
    }

    let exactIconAttempts = 0;
    applyExactModuleIcons();
    const exactIconTimer = window.setInterval(() => {
      applyExactModuleIcons();
      exactIconAttempts += 1;
      if (exactIconAttempts >= 80) window.clearInterval(exactIconTimer);
    }, 250);
  </script>
</body>
</html>
