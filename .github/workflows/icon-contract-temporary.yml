name: Temporary launcher icon contract audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  icon-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          ref: fix/icon-contract-2026-08-07
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Run icon contract pipeline
        run: python .github/icon-contract.py

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: launcher-icon-contract
          path: icon-contract-output/
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated release when requested
        run: |
          if [ ! -f icon-contract-output/APPLY_READY ]; then
            echo "Audit-only run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-shell/app.js assets/app-shell/approved-icon-scale.css assets/app-shell/icons/field-lab index.html shortcut.html site.webmanifest version.json
          git add -u assets/app-shell/icons/field-lab
          git commit -m "Standardize launcher icons on transparent PNG contract"
          git push origin HEAD:fix/icon-contract-2026-08-07
